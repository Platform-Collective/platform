# Dependabot version updates.
#
# - Docker: upstream images that are not built by us:
#   - dev/base-image: Node images used to build the platformcollective/* base
#     images. Service/pod Dockerfiles use those platformcollective/* images,
#     which are built manually via the "Docker base image" workflow.
#   - foundations/hulylake (rust, debian) and foundations/stream (golang, alpine).
#     Note: `alpine` without a tag is not updated by Dependabot.
# - GitHub Actions: workflows in .github/workflows and composite actions in
#   .github/actions/*.
# - npm is intentionally not configured: this is a Rush monorepo without a root
#   package.json, so Dependabot version updates do not work here. Use `rush update`.

version: 2
updates:

  # Upstream images
  - package-ecosystem: "docker"
    directories:
      - "/dev/base-image"
      - "/foundations/hulylake"
      - "/foundations/stream"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Node major upgrades are a deliberate, manual decision
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      node:
        patterns: ["node"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Minor/patch bumps in one PR; majors get individual PRs
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

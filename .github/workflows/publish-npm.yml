name: Publish npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSH_BUILD_CACHE_ENABLED: '0'
    steps:
      - name: Require a release tag
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Publishing requires a stable v<major>.<minor>.<patch> tag, including manual runs."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.19.1 --ignore-scripts
      - name: Installing...
        run: node common/scripts/install-run-rush.js install
      - name: Verify release version
        # Before tagging, run: node common/scripts/bump.js <version> (see README.md).
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          node common/scripts/bump.js --check "$VERSION"
          if [[ "$VERSION" == "0.7.423" ]] || ! printf '%s\n' 0.7.423 "$VERSION" | sort -V -C; then
            echo "::error::The release version must be greater than 0.7.423."
            exit 1
          fi
      - name: Building...
        run: node common/scripts/install-run-rush.js build
      - name: Emit TypeScript declarations
        run: node common/scripts/install-run-rush.js validate
      - name: Pack and verify TypeScript declarations
        run: node common/scripts/safe-publish.js --pack "$RUNNER_TEMP/npm-packages"
      - uses: actions/upload-artifact@v6
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    needs: build
    permissions:
      contents: read
      id-token: write
    # Create this environment with required reviewers and v* tag rules before merging.
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.19.1 --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-publish.npmrc
        run: |
          # npm tries OIDC first. Configure token fallback only when a secret is supplied.
          printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
          if [ -n "$NPM_TOKEN" ]; then
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> "$NPM_CONFIG_USERCONFIG"
          fi
          node common/scripts/safe-publish.js --publish-packed "$RUNNER_TEMP/npm-packages"

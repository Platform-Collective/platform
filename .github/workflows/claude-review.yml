name: Claude PR Review

on:
  pull_request:
    # No 'synchronize': new pushes are not reviewed automatically.
    # To re-review, use "Re-run jobs" on the workflow run in the Actions tab.
    types: [opened, ready_for_review, reopened]
    branches: [develop, staging, staging-new, main]
    # Skip PRs that only touch non-code files
    paths-ignore:
      - 'docs/**'
      - 'branding/**'
      - '**/*.md'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, PRs from forks and Dependabot (secrets are not available there)
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. First read AGENTS.md in the repo root and follow
            the project conventions described there (TypeScript/Svelte 4 monorepo, Rush).

            Focus on:
            - Bugs, logic errors, race conditions, unhandled errors
            - Security issues (auth, injection, secrets, unsafe input handling)
            - Breaking changes to models/API and missing migrations
            - Duplicated resource definitions (AnyComponent / IntlString / Ref declarations
              must be defined only once)
            - Missing or weak tests for changed behavior
            - Violations of the code style in AGENTS.md

            Ignore lock files (e.g. common/config/rush/pnpm-lock.yaml, package-lock.json)
            and generated files; do not read them.

            Do NOT comment on pure formatting or lint issues (CI handles them), and avoid
            nitpicks. Only write high-signal comments: report a problem only if you are
            confident it is real and worth the author's time. Keep every comment short
            (1-3 sentences, no restating the diff, no praise or filler). If nothing
            significant is found, say so in one line.

            Use inline comments for specific lines and one short top-level summary comment
            via `gh pr comment`. Write in English.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 20
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
